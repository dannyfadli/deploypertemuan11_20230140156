<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Praktikum 11</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-500 to-indigo-700 flex items-center justify-center min-h-screen p-4">

<div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md transform transition-all hover:scale-[1.01] my-8">
    <div class="text-center mb-6">
        <h1 class="text-3xl font-extrabold text-gray-800 tracking-tight">Buat Akun</h1>
        <p class="text-gray-500 mt-2 text-sm">Silakan isi data di bawah ini untuk mendaftar</p>
    </div>

    <div th:if="${error}" class="mb-4 bg-red-50 border-l-4 border-red-500 p-4 rounded shadow-sm">
        <p class="text-sm text-red-700 font-medium" th:text="${error}">Pendaftaran gagal!</p>
    </div>

    <form th:action="@{/register}" th:object="${request}" method="post" class="space-y-4">

        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">Username</label>
            <input type="text"
                   th:field="*{username}"
                   required
                   placeholder="Username untuk login"
                   class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition duration-200 placeholder-gray-400 text-sm">
        </div>

        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
            <input type="password"
                   th:field="*{password}"
                   required
                   placeholder="••••••••"
                   class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition duration-200 placeholder-gray-400 text-sm">
        </div>

        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">Nama Lengkap</label>
            <input type="text"
                   th:field="*{nama}"
                   required
                   placeholder="Nama lengkap anda"
                   class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition duration-200 placeholder-gray-400 text-sm">
        </div>

        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">Alamat</label>
            <input type="text"
                   th:field="*{alamat}"
                   required
                   placeholder="Alamat domisili"
                   class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition duration-200 placeholder-gray-400 text-sm">
        </div>

        <button type="submit"
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg shadow-lg hover:shadow-xl transform active:scale-[0.98] transition duration-200 mt-2">
            Daftar Sekarang
        </button>
    </form>

    <div class="mt-6 text-center border-t border-gray-100 pt-4">
        <p class="text-sm text-gray-600">
            Sudah punya akun?
            <a th:href="@{/login}" class="text-indigo-600 hover:text-indigo-800 font-semibold transition duration-200">Masuk di sini</a>
        </p>
    </div>
</div>

</body>
</html>
